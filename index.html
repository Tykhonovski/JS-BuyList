<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
    <link rel="stylesheet" type="text/css" href="main.css" />
</head>

<body>
    <div class="container">
        
        <div class="left-panel">
            <div class="add-item-form">
                <input type="text" id="new-item-name" placeholder="Назва товару">
                <button class="btn-add" id="btn-add">Додати</button>
            </div>

            <ul class="product-list" id="product-list">
            </ul>
        </div>

        <div class="right-panel">
            <div class="stats-card">
                <h3>Залишилося</h3>
                <div class="tags" id="left-to-buy">
                </div>
            </div>
            
            <div class="stats-card">
                <h3>Куплено</h3>
                <div class="tags" id="already-bought">
                </div>
            </div>
        </div>

    </div>

    <div class="author-badge">
        <span class="badge-title">Buy List</span>
        <span class="badge-name">Created by:<br>Tykhonovski Yehor</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
